name: Validate tree explorer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r pipeline/requirements.txt
      - run: python -m pip install cfn-lint
      - run: cfn-lint infra/staging.yaml
      - run: npm run data:test
      - run: npm run data:validate
      - run: npm run data:build
      - run: npm test
      - run: npm run lint
      # Compile the app without downloading the multi-gigabyte full publication.
      # The manually dispatched dataset workflow validates and publishes that publication.
      - run: npm run build:app
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
