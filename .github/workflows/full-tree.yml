name: Validate complete OpenTree release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r pipeline/requirements.txt
      - run: npm run data:life
      - run: npm run data:life:validate
      - run: npm run benchmark:life
      - run: npm run data:build
      - run: npm test
      - run: npm run data:test
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: full-tree-validation
          path: benchmarks/results/life-*.json
