AWSTemplateFormatVersion: '2010-09-09'
Description: Tree of Life staging - private S3, CloudFront HTTPS, optional GitHub OIDC deployment, cost alert.
Parameters:
  ReleaseId:
    Type: String
    Default: unpublished
    AllowedPattern: '[a-zA-Z0-9][a-zA-Z0-9_-]{0,79}'
    Description: On infrastructure updates, supply the currently active release from deploy_cloud.py status.
  AlertEmail:
    Type: String
    AllowedPattern: '[^\s@]+@[^\s@]+\.[^\s@]+'
  MonthlyBudgetUSD:
    Type: Number
    MinValue: 1
    Description: Account-wide monthly cost alert threshold. This does not cap spending.
  GitHubRepository:
    Type: String
    Default: jimrudolph726/tree-of-life
    AllowedPattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
  GitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: Optional existing token.actions.githubusercontent.com OIDC provider ARN. Never creates a duplicate account provider.
Conditions:
  HasGitHubOidc: !Not [!Equals [!Ref GitHubOidcProviderArn, '']]
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-s3'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  ImmutableCache:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-immutable'
        MinTTL: 0
        DefaultTTL: 31536000
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} - Tree of Life staging'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
        Origins:
          - Id: AppOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginPath: !Sub '/releases/${ReleaseId}'
            OriginAccessControlId: !Ref OriginAccess
            S3OriginConfig: {OriginAccessIdentity: ''}
          - Id: DataOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccess
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: AppOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # AWS managed CachingDisabled: HTML and dataset pointers must stay fresh.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CacheBehaviors:
          - PathPattern: '/data/*/*/*'
            TargetOriginId: DataOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref ImmutableCache
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          - PathPattern: '/assets/*'
            TargetOriginId: DataOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref ImmutableCache
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        # Never replace missing JSON/binary data with index.html.
        CustomErrorResponses:
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ErrorCachingMinTTL: 0
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontRead
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-account-cost-alert'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUSD, Unit: USD}
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
  ServerErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CloudFront staging 5xx rate over 5 percent for 3 consecutive minutes. View in CloudWatch us-east-1.
      Namespace: AWS/CloudFront
      MetricName: 5xxErrorRate
      Dimensions:
        - {Name: DistributionId, Value: !Ref Distribution}
        - {Name: Region, Value: Global}
      Statistic: Average
      Period: 60
      EvaluationPeriods: 3
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  DeployRole:
    Type: AWS::IAM::Role
    Condition: HasGitHubOidc
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidcProviderArn}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:environment:staging'
      Policies:
        - PolicyName: DeployStaging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource:
                  - !Sub '${SiteBucket.Arn}/data/*'
                  - !Sub '${SiteBucket.Arn}/assets/*'
                  - !Sub '${SiteBucket.Arn}/releases/*'
              - Effect: Allow
                Action: [cloudfront:GetDistribution, cloudfront:GetDistributionConfig, cloudfront:UpdateDistribution, cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
Outputs:
  BucketName: {Value: !Ref SiteBucket}
  DistributionId: {Value: !Ref Distribution}
  WebsiteUrl: {Value: !Sub 'https://${Distribution.DomainName}'}
  DeployRoleArn:
    Condition: HasGitHubOidc
    Value: !GetAtt DeployRole.Arn
